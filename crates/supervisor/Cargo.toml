[package]
name = "zicato-supervisor"
version = "0.1.0"
edition = "2021"
description = "Watchdog + dashboard server for the zicato runtime state files."
license = "Apache-2.0"

[lib]
name = "zicato_supervisor"
path = "src/lib.rs"

[[bin]]
name = "zicato-supervisor"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.132"
tokio = { version = "=1.41.0", features = ["full"] }
axum = { version = "=0.7.7", features = ["macros"] }
tower-http = { version = "=0.5.2", features = ["trace", "cors"] }
tower = "=0.5.1"
notify = "=6.1.1"
nix = { version = "=0.27.1", features = ["signal"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
chrono = { version = "=0.4.38", features = ["serde"] }
futures = "=0.3.31"
mime_guess = "=2.0.5"
include_dir = "=0.7.4"
walkdir = "=2.5.0"
async-stream = "=0.3.6"
libc = "=0.2.161"
tokio-stream = { version = "=0.1.16", features = ["sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.13.0"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "stream"] }

# NOTE: the [profile.release] tuning lives in the workspace-root
# Cargo.toml. Cargo ignores profiles declared on a non-root workspace
# member, so keeping it here would silently drop the optimizations.
