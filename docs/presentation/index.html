font-family="JetBrains Mono" font-size="13" fill="#565E66">01</text><text x="92.0" y="326" font-family="JetBrains Mono" font-size="15" fill="#3FB87A" font-weight="bold" letter-spacing="1.0">NOISY</text><text x="92.0" y="364" font-family="JetBrains Mono" font-size="15" fill="#EDEFEA">LLM stochasticity.</text><text x="92.0" y="404" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">One duel misleads — the</text><text x="92.0" y="428" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">same pair re-run disagrees.</text><text x="92.0" y="452" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">A single win can be luck.</text><rect x="361.5" y="248" width="267.5" height="300" rx="5" fill="#15181C" stroke="#262B31" stroke-width="1.0"/><line x1="361.5" y1="266.0" x2="361.5" y2="530.0" stroke="#6F8FA6" stroke-width="2.4"/><text x="381.5" y="288" font-family="JetBrains Mono" font-size="13" fill="#565E66">02</text><text x="381.5" y="326" font-family="JetBrains Mono" font-size="15" fill="#6F8FA6" font-weight="bold" letter-spacing="1.0">EXPENSIVE</text><text x="381.5" y="364" font-family="JetBrains Mono" font-size="15" fill="#EDEFEA">A board run costs budget.</text><text x="381.5" y="404" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">Every evaluation burns tokens</text><text x="381.5" y="428" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">and wall-clock. You cannot</text><text x="381.5" y="452" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">re-measure for free.</text><rect x="651.0" y="248" width="267.5" height="300" rx="5" fill="#15181C" stroke="#262B31" stroke-width="1.0"/><line x1="651.0" y1="266.0" x2="651.0" y2="530.0" stroke="#3FB87A" stroke-width="2.4"/><text x="671.0" y="288" font-family="JetBrains Mono" font-size="13" fill="#565E66">03</text><text x="671.0" y="326" font-family="JetBrains Mono" font-size="15" fill="#3FB87A" font-weight="bold" letter-spacing="1.0">A PROXY</text><text x="671.0" y="364" font-family="JetBrains Mono" font-size="15" fill="#EDEFEA">Goodhart&#x27;s law.</text><text x="671.0" y="404" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">The metric is a stand-in. Push</text><text x="671.0" y="428" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">it hard and you game it —</text><text x="671.0" y="452" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">you overfit the board.</text><rect x="940.5" y="248" width="267.5" height="300" rx="5" fill="#15181C" stroke="#262B31" stroke-width="1.0"/><line x1="940.5" y1="266.0" x2="940.5" y2="530.0" stroke="#6F8FA6" stroke-width="2.4"/><text x="960.5" y="288" font-family="JetBrains Mono" font-size="13" fill="#565E66">04</text><text x="960.5" y="326" font-family="JetBrains Mono" font-size="15" fill="#6F8FA6" font-weight="bold" letter-spacing="1.0">NEVER REGRESS</text><text x="960.5" y="364" font-family="JetBrains Mono" font-size="15" fill="#EDEFEA">Protect what worked.</text><text x="960.5" y="404" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">A change must never silently</text><text x="960.5" y="428" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">break a task that passed</text><text x="960.5" y="452" font-family="JetBrains Mono" font-size="13" fill="#C9CABF">before. Asymmetric risk.</text><text x="72" y="592" font-family="JetBrains Mono" font-size="14" fill="#8A929B">The crux: get a signal that is real, cheap enough, hard to game, and regression-guarded.</text><line x1="72" y1="674" x2="1208" y2="674" stroke="#262B31" stroke-width="1"/><text x="72" y="696" font-family="JetBrains Mono" font-size="11" fill="#565E66" letter-spacing="1.5">03 / 12</text><text x="1154.0" y="697" font-family="JetBrains Mono" font-size="15" fill="#8A929B" letter-spacing="0">zıcato</text><circle cx="1167.68" cy="686.50" r="1.12" fill="#3FB87A"/></svg></div>

 Mono" font-size="11" fill="#8A929B" text-anchor="middle">regression-guarded</text><line x1="217.0" y1="304.0" x2="330.0" y2="304.0" stroke="#6F8FA6" stroke-width="1.8"/><path d="M330.0,304.0 L322.7,307.3 M330.0,304.0 L322.7,300.7" stroke="#6F8FA6" stroke-width="1.8" stroke-linecap="round" fill="none"/><line x1="530.0" y1="304.0" x2="615.0" y2="304.0" stroke="#6F8FA6" stroke-width="1.8"/><path d="M615.0,304.0 L607.7,307.3 M615.0,304.0 L607.7,300.7" stroke="#6F8FA6" stroke-width="1.8" stroke-linecap="round" fill="none"/><line x1="825.0" y1="304.0" x2="910.0" y2="304.0" stroke="#6F8FA6" stroke-width="1.8"/><path d="M910.0,304.0 L902.7,307.3 M910.0,304.0 L902.7,300.7" stroke="#6F8FA6" stroke-width="1.8" stroke-linecap="round" fill="none"/><rect x="72" y="392" width="656" height="228" rx="5" fill="#0B0D10" stroke="#262B31" stroke-width="1.0"/><text x="96" y="424" font-family="JetBrains Mono" font-size="12" fill="#8A929B" letter-spacing="2.0">THE WEIGHTED SCALAR</text><text x="96" y="460" font-family="FreeMono" font-size="15" fill="#EDEFEA" xml:space="preserve">scalar = pass_weight · (1 − mean_score)</text><text x="96" y="486" font-family="FreeMono" font-size="15" fill="#EDEFEA" xml:space="preserve">       + sum over sorted namespaces of  channel[ns]</text><rect x="96" y="510" width="54" height="26" rx="3" fill="#15181C" stroke="#262B31" stroke-width="1.0"/><text x="123" y="527" font-family="JetBrains Mono" font-size="10.5" fill="#C9CABF" text-anchor="middle">drift:</text><rect x="159" y="510" width="54" height="26" rx="3" fill="#15181C" stroke="#262B31" stroke-width="1.0"/><text x="186" y="527" font-family="JetBrains Mono" font-size="10.5" fill="#C9CABF" text-anchor="middle">judge:</text><rect x="222" y="510" width="66.5" height="26" rx="3" fill="#16241D" stroke="#3FB87A" stroke-width="1.0"/><text x="255.25" y="527" font-family="JetBrains Mono" font-size="10.5" fill="#3FB87A" text-anchor="middle">failure:</text><rect x="297.5" y="510" width="66.5" height="26" rx="3" fil const slides=[...document.querySelectorAll('#stage > .slide')];const N=slides.length;
const hud=document.getElementById('hud');const grid=document.getElementById('grid');let cur=-1;
function show(i){cur=(i%N+N)%N;slides.forEach((s,j)=>s.classList.toggle('on',j===cur));
 hud.textContent=String(cur+1).padStart(2,'0')+' / '+N;const h='#'+(cur+1);if(location.hash!==h)history.replaceState(null,'',h);}
function buildGrid(){if(grid.childElementCount)return;slides.forEach((s,i)=>{const c=document.createElement('div');c.className='cell';
 c.innerHTML=s.innerHTML;const cap=document.createElement('div');cap.className='cap';cap.textContent=String(i+1).padStart(2,'0');
 c.appendChild(cap);c.onclick=()=>{grid.classList.remove('on');show(i);};grid.appendChild(c);});}
function toggleGrid(){buildGrid();grid.classList.toggle('on');}
function fs(){document.fullscreenElement?document.exitFullscreen():(document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen());}
addEventListener('keydown',e=>{if(e.key==='g'||e.key==='G'){toggleGrid();return;}if(e.key==='Escape'){grid.classList.remove('on');return;}
 if(grid.classList.contains('on'))return;
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')show(cur+1);
 else if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1);
 else if(e.key==='Home')show(0);else if(e.key==='End')show(N-1);
 else if(e.key==='f'||e.key==='F')fs();
 else if(/^[1-9]$/.test(e.key))show(+e.key-1);else if(e.key==='0')show(9);});
addEventListener('click',e=>{if(grid.classList.contains('on'))return;show(e.clientX<innerWidth/2?cur-1:cur+1);});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=N&&n-1!==cur)show(n-1);});
const st=parseInt(location.hash.slice(1),10);show(st>=1&&st<=N?st-1:0);
</script></body></html>
