[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zicato"
version = "0.3.0"
description = "A self-improving harness for any system you can measure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = [
    "agents",
    "multi-agent",
    "harness",
    "meta-learning",
    "drift",
    "goldfive",
    "adk",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click >= 8.1",
    "jsonschema >= 4.20",
    # The Foe runtime's Python host package: zicato's only proposer runtime.
    # It builds the execution-contract document, launches the `foe` binary,
    # and answers the host protocol. Pinned to one commit because Foe
    # publishes no release yet and its interfaces are unstable; the binary a
    # workspace configures must be built from the same commit, which
    # `FoeProposerAgent` asserts through the package's own compatibility
    # check. Bump the rev here and in [tool.uv.sources] together.
    "foe @ git+https://github.com/pedapudi/foe.git@63ba2c61486eaa45c935e720b693209db0670ef5#subdirectory=python",
]

[project.optional-dependencies]
# Optional Goldfive capabilities. Zicato's core keeps the drift vocabulary as
# strings and imports Goldfive only for an adapter that declares the
# integration. The base extra supplies the event runtime; remote endpoints,
# local embeddings, and the built-in ADK composition have separate profiles.
goldfive = [
    "goldfive @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
]
goldfive-remote = [
    "goldfive[remote] @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
]
goldfive-local-embedding = [
    "goldfive[embedding] @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
]
adk = [
    "google-adk[extensions]",
    "goldfive[adk] @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
]
# The standalone dashboard service: a Starlette/ASGI app served by
# uvicorn, with a watchdog-backed file watcher for the SSE stream.
dashboard = [
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
]
# The terminal console (`zicato tui`) — a SECOND RENDERER of the dashboard
# service's payloads, not a second brain. Textual only: the TUI's service
# client is stdlib urllib, so a terminal install stays small and can review a
# workspace from a machine that could not serve one. Pinned exactly, because
# the Pilot snapshot tests compare rendered text and a framework bump can move
# it.
tui = [
    "textual == 8.2.8",
]
# Every operator-facing live view: browser, terminal, and execution telemetry.
observability = [
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
    "textual == 8.2.8",
    "harmonograf-client",
    "harmonograf-server",
]
# Complete runtime profile. Keep this explicit so wheel metadata alone defines
# the profile and installers need no project-specific composition rules.
all = [
    "goldfive[adk,embedding,remote] @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
    "google-adk[extensions]",
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
    "textual == 8.2.8",
    "harmonograf-client",
    "harmonograf-server",
]

dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.23",
    # Parallel test execution across worker processes. The default test
    # run uses `-n auto` (see [tool.pytest.ini_options] addopts) so the
    # ~5990-case suite fans out across CPU cores. The suite is already
    # process-isolation-clean (tmp_path everywhere, dynamic ports via
    # bind(("127.0.0.1", 0)), tempdir-isolated worker fixtures) so xdist
    # needs no per-test fixes. `-n0` on the command line overrides back
    # to a single in-process serial run for debugging.
    "pytest-xdist >= 3.5",
    # The pre-commit framework itself, installed into .venv/bin/ via
    # `uv sync --all-extras`. The shared `.git/hooks/pre-commit` shim
    # (installed by `uv run pre-commit install`) execs
    # `.venv/bin/python -m pre_commit ...`, so pre-commit must live in
    # the project venv — not in a global pipx / uv-tool location — for
    # `git commit` to run the same checks contributors test with via
    # `uv run pre-commit run --all-files`.
    "pre-commit >= 4",
    # Pinned to the exact version the pre-commit ruff hook uses
    # (.pre-commit-config.yaml) so local lint/format and the hook
    # never diverge.
    "ruff == 0.5.7",
    "mypy >= 1.10",
    # Enforces the library/driver import contracts declared in
    # [tool.importlinter] below (`uv run lint-imports`; wired into
    # `make check` and CI).
    "import-linter >= 2.0",
    "types-jsonschema",
    "types-protobuf",
    # The dashboard service and its TestClient-based tests.
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
    "httpx >= 0.27",
    # The terminal console and its Pilot-driven tests.
    "textual == 8.2.8",
    # The vendored dogfood targets — a separate distribution under
    # examples/, resolved as a uv workspace member (see
    # [tool.uv.sources] below). The test_example_* smoke tests import
    # it as `zicato_examples.*`. It is never shipped in the zicato
    # wheel.
    "zicato-examples",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
zicato = "zicato.cli:main"

[project.urls]
Homepage = "https://github.com/pedapudi/zicato"
Issues = "https://github.com/pedapudi/zicato/issues"

[tool.hatch.build.targets.wheel]
# The package lives under a src/ root; hatchling strips the src/
# prefix so the wheel still ships top-level `zicato/`.
packages = ["src/zicato"]

# The dashboard's JS test harness under static/test/ is a developer
# tool — it runs the frontend behaviour tests under `node` and is
# exercised by tests/test_dashboard_js.py. It is NOT part of the
# shipped dashboard bundle, so it is excluded from the wheel.
exclude = [
    "src/zicato/dashboard/static/test",
]

# Custom build hook (hatch_build.py): compiles the Rust supervisor
# crate and bundles the binary at zicato/_bin/zicato-supervisor so it
# ships inside the wheel. Best-effort — see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the crate source so a downstream wheel build can
# still run the supervisor build hook.
[tool.hatch.build.targets.sdist]
include = [
    "src/zicato",
    "crates",
    "Cargo.toml",
    "Cargo.lock",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports (banned-api: retired private-reach paths)
]

# The specific cross-module private reaches retired by the library/driver
# restructure. Each name was promoted to a public seam at its honest home;
# these bans keep the old underscore paths from regrowing.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"zicato.orchestrator._compute_field_diversity".msg = "moved: use zicato.selection.diversity.compute_field_diversity"
"zicato.orchestrator._jaccard".msg = "moved: use zicato.selection.diversity.jaccard"
"zicato.runtime._atomic".msg = "deleted shim: use the public zicato.storage face (read_json / atomic_write_json / atomic_write_text / atomic_claim)"
"zicato.storage._atomic.read_json".msg = "use the public face: from zicato.storage import read_json"
"zicato.storage.factory.default_backend".msg = "deleted: use zicato.storage.workspace_backend(root, start=True)"
"zicato.epoch._storage.backend_for".msg = "deleted duplicate: use zicato.storage.workspace_backend(root, start=False)"
"zicato.runtime._storage.backend_for".msg = "deleted duplicate: use zicato.storage.workspace_backend(root, start=False)"
"zicato.epoch.lifecycle._scoring_to_dict".msg = "promoted: use zicato.epoch.lifecycle.scoring_to_dict"
"zicato.epoch.contract._round_floats".msg = "deleted: use zicato.epoch.contract.scoring_contract_to_canon for contract scoring canonicalization"
"zicato.epoch.contract._scoring_to_canon".msg = "promoted: use zicato.epoch.contract.scoring_to_canon"
"zicato.board.jsonl._entry_to_dict".msg = "promoted: use zicato.board.jsonl.entry_to_dict"
"zicato.board.jsonl._board_meta_to_dict".msg = "promoted: use zicato.board.jsonl.board_meta_to_dict"
"zicato.proposer.skills._parse_frontmatter".msg = "promoted: use zicato.proposer.skills.parse_frontmatter"
"zicato.workspace_loader._scoring_weights_from_dict".msg = "promoted: use zicato.workspace_loader.scoring_weights_from_dict"
"zicato.analyzer.aggregator._to_snake".msg = "deleted: use zicato.telemetry.event_log.to_snake"
"zicato.analyzer.process_exemplars._to_snake".msg = "deleted: use zicato.telemetry.event_log.to_snake"
"zicato.telemetry.reducer._camel_to_snake".msg = "deleted: use zicato.telemetry.event_log.to_snake"
"zicato.query.transcript_reconstruction._snake_deep".msg = "deleted: use zicato.telemetry.event_log.snake_deep"
"zicato.adapters.adk._entry_judge_only".msg = "promoted: use zicato.adapters.entry_judge_only"
"zicato.adapters.adk._entry_disable_drift".msg = "promoted: use zicato.adapters.entry_disable_drift"
"zicato.orchestrator._epoch_preflight_record".msg = "moved: use zicato.health.inputs.epoch_preflight_record"
"zicato.orchestrator._epoch_noise_floor_inputs".msg = "moved: use zicato.health.inputs.epoch_noise_floor_inputs"
"zicato.orchestrator._epoch_tree_import_gaps".msg = "moved: use zicato.health.inputs.epoch_tree_import_gaps"
"zicato.orchestrator._workspace_preflight_gate".msg = "moved: use zicato.health.inputs.workspace_preflight_gate"
"zicato.orchestrator._str_tuple".msg = "moved: use zicato.health.inputs.str_tuple"
"zicato.tournament.gate._regressed_namespaces".msg = "promoted: use zicato.tournament.gate.regressed_namespaces"

[tool.ruff.lint.per-file-ignores]
# The storage package owns its private _atomic module; its own modules
# (and the _atomic unit test) import it directly. Everyone else goes
# through the public zicato.storage face.
"src/zicato/storage/**" = ["TID251"]
"tests/test_storage_atomic.py" = ["TID251"]

[tool.ruff.lint.isort]
# Declare the in-repo packages as first-party so isort sorts them into
# their own import group (after third-party). Without this ruff treats
# `zicato` / `zicato_examples` as third-party and flags the blank line
# the source files place between them and real third-party imports
# (I001). Pre-commit only lints *changed* files, so the mismatch went
# unnoticed until CI's repo-wide `ruff check .`.
known-first-party = ["zicato", "zicato_examples"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

# goldfive, google.adk, and harmonograf_client are runtime-optional
# dependencies; their stubs are not on PyPI and the modules may not be
# importable in the typecheck environment. Treat references as untyped
# rather than erroring at import time so the typecheck still covers the
# rest of the tree. (harmonograf_client is now a hard runtime dependency
# via [tool.uv.sources] — pinned to a specific commit of
# github.com/pedapudi/harmonograf, subdirectory "client" — so the live-
# streaming sink resolves automatically; the lazy import inside a
# guarded try/except in zicato.telemetry.sink remains, both to keep the
# module import-safe in degraded installs and to tolerate API drift.)
#
# Only third-party modules belong here. zicato.index and zicato.health
# ship in this distribution, so mypy resolves and checks them like any
# other first-party package.
[[tool.mypy.overrides]]
module = [
    "goldfive",
    "goldfive.*",
    "google",
    "google.*",
    "harmonograf_client",
    "harmonograf_client.*",
    "harmonograf_server",
    "harmonograf_server.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default run: the FAST TIER, fanned out across CPU cores with
# pytest-xdist. `-n auto` spawns one worker per detected core (the suite
# is process-isolation-clean — see the pytest-xdist note in the `dev`
# extra). Override to a single serial in-process run for debugging with
# `-n0` on the command line, e.g. `pytest -n0 tests/test_foo.py::test_bar`.
#
# Three marker terms are excluded, for three different reasons:
#
#   not node        drops the `test_dashboard_js` shim that re-runs the
#                   whole standalone Node suite inside pytest (a full
#                   duplicate of `make node-test` / the standalone
#                   `node src/zicato/dashboard/static/test/run-all.mjs`
#                   run); pass `-m node` or run `make node-test` to
#                   exercise the Node behaviour suite.
#   not cascade_oc  drops the opt-in evaluation-cascade measurement
#                   suite (CASCADE.md §4); run it with `-m cascade_oc`.
# The `slow` tier is NOT excluded here. It is deselected by
# `pytest_collection_modifyitems` in tests/conftest.py, and only when the
# run is the bare default — nothing named on the command line: no test path
# or node id, no `-k`, no explicit `-m`. Naming a file, a test or a keyword
# therefore runs it in full, whatever tier it is in, so no recipe in this
# repository has to remember a selector to mean what it says. See the
# `slow` marker below.
addopts = "-n auto -m 'not node and not cascade_oc'"
# Custom markers. Two of them answer different questions and must not be
# conflated: `slow` is about a test's measured RUNTIME (which tier
# schedules it), `integration` is about what a test TOUCHES (a process or
# network boundary, so its runtime is the coverage and stubbing it deletes
# what it proves). A test can carry either, both, or neither — the four
# combinations are all meaningful, and most `integration` tests are fast
# enough to run in the default tier.
#
# `slow` is applied by MEASUREMENT, not by judgement: run
# `pytest --durations=0` and mark what comes back at 15 s or more.
# tests/test_slow_tier_registry.py pins the marked set against a declared
# list so the tier cannot drift silently.
#
# A bare `pytest` is the ONLY invocation that drops the tier. Everything
# that selects something — a path, a node id, a `-k`, an explicit `-m` —
# runs what it names.
markers = [
    "node: shells out to the standalone Node test harness (run via `make node-test`)",
    "slow: one test measured at 15 s or more ALONE (`-n0`; statistical characterizations and end-to-end simulations); deselected ONLY by a bare `pytest` (see tests/conftest.py) — naming a file, a test or a `-k` keyword runs it, `-m slow` runs the tier alone, and `make test` and tools/parity.sh run both tiers",
    "integration: crosses a process or network boundary (worker subprocesses, live servers, git subprocesses); its runtime IS its coverage, so it is never a candidate for stubbing",
    "cascade_oc: the opt-in evaluation-cascade OC measurement suite (CASCADE.md §4); EXCLUDED from the default run via addopts — run with `-m cascade_oc`",
]
# With the package under src/, an editable install puts `zicato` on
# sys.path, but a bare `pytest` from a non-installed checkout would
# not see it. Pin the repo root explicitly so src-layout imports
# resolve via the installed/editable package consistently.
pythonpath = ["."]

# The library/driver import contracts (`uv run lint-imports`; wired into
# `make check` and CI). zicato is a library first — the surface declared
# in zicato/__init__.py — with three drivers on top: zicato.cli,
# zicato.dashboard (the HTTP server), zicato.builder. The contracts pin:
#
# 1. No library package imports a driver. zicato.query is LIBRARY code
#    (the workspace query layer the dashboard consumes) — it appears in
#    the source list like every other lib package.
# 2. The only driver->driver edges are the two declared ones:
#    cli -> dashboard (the CLI launches the server and resolves its
#    static bundle) and dashboard -> builder (server.py mounts the
#    builder's REST routes). Everything else is forbidden.
[tool.importlinter]
root_packages = ["zicato"]

[[tool.importlinter.contracts]]
name = "the library must not import the drivers (cli / dashboard / builder)"
type = "forbidden"
source_modules = [
    "zicato._tournament_worker",
    "zicato.adapter_factory",
    "zicato.adapters",
    "zicato.analyzer",
    "zicato.aux_timeout",
    "zicato.board",
    "zicato.check",
    "zicato.config",
    "zicato.core",
    "zicato.emulator",
    "zicato.epoch",
    "zicato.evolve",
    "zicato.health",
    "zicato.import_path",
    "zicato.index",
    "zicato.judge_runtime",
    "zicato.models_config",
    "zicato.mutation",
    "zicato.orchestrator",
    "zicato.patterns",
    "zicato.proposer",
    "zicato.query",
    "zicato.runtime",
    "zicato.runtime_factory",
    "zicato.scoring",
    "zicato.selection",
    "zicato.storage",
    "zicato.synthetic",
    "zicato.telemetry",
    "zicato.testing",
    "zicato.tournament",
    "zicato.util",
    "zicato.workspace",
    "zicato.workspace_loader",
]
forbidden_modules = [
    "zicato.cli",
    "zicato.dashboard",
    "zicato.builder",
    "zicato.tui",
]

# The terminal console is a FOURTH driver, and the strictest one: it reaches
# the workspace ONLY over the dashboard service's HTTP API. Forbidding the
# import of every other driver — including the dashboard itself — is what makes
# "a second renderer, never a second brain" structural rather than a promise.
# It spawns the service by argv (`python -m zicato.dashboard`), never by import.
[[tool.importlinter.contracts]]
name = "tui driver: no import of the other drivers (it speaks HTTP, not Python)"
type = "forbidden"
source_modules = ["zicato.tui"]
forbidden_modules = ["zicato.cli", "zicato.dashboard", "zicato.builder"]

[[tool.importlinter.contracts]]
name = "dashboard driver: no import of the cli (dashboard -> builder mount is the declared edge)"
type = "forbidden"
source_modules = ["zicato.dashboard"]
forbidden_modules = ["zicato.cli"]

[[tool.importlinter.contracts]]
name = "builder driver: no import of the other drivers"
type = "forbidden"
source_modules = ["zicato.builder"]
forbidden_modules = ["zicato.cli", "zicato.dashboard"]

[[tool.importlinter.contracts]]
name = "cli driver: no direct import of the builder (cli -> dashboard is the declared edge)"
type = "forbidden"
source_modules = ["zicato.cli"]
forbidden_modules = ["zicato.builder"]
# Direct only: the cli legitimately reaches the builder TRANSITIVELY
# through the two declared edges (cli -> dashboard.server -> builder.api
# mount); what this contract forbids is the cli growing its own builder
# dependency.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the proposer's patch validator has no path to the board"
type = "forbidden"
source_modules = ["zicato.proposer.validate"]
forbidden_modules = [
    "zicato.board",
    "zicato.judge_runtime",
    "zicato.emulator",
    "zicato.adapters",
    "zicato.adapter_factory",
    "zicato._tournament_worker",
]
# The governing principle of docs/design/PROPOSER.md: the proposer may
# check its patch by any means that consumes no board data and produces no
# scores, and may NEVER execute board entries. `validate_patches` is the
# only proposer tool that writes anything at all, so the claim is pinned
# structurally rather than by inspection.
#
# The forbidden set is exactly the CAPABILITY surface: `zicato.board` is
# where entry text is loaded, `zicato.adapters` / `zicato.adapter_factory`
# / `zicato._tournament_worker` are how a harness is loaded and run, and
# `zicato.emulator` / `zicato.judge_runtime` are how an entry is judged.
# The validator can reach none of them, transitively or otherwise.
#
# `zicato.scoring` and `zicato.tournament` are deliberately NOT listed:
# they are reachable from every module in the repo through
# `zicato.core.types` -> `zicato.core.scoring_config`, which imports them
# for TYPE definitions. That edge is a type-model artifact, not a
# capability — nothing on it reads a board entry or produces a score — and
# listing them would make the contract unsatisfiable for reasons that say
# nothing about this module. The capability claim is carried by the list
# above and by the runtime closure pin in tests/test_proposer_validate.py.
#
# The tier-3 `adapter.load` probe reaches an adapter by SPAWNING
# `zicato.proposer._load_probe` as a subprocess, which is exactly why the
# probe lives in its own module: it keeps the adapter packages on this
# forbidden list instead of forcing an exemption.

[[tool.importlinter.contracts]]
name = "the query layer stays dashboard-free"
type = "forbidden"
source_modules = ["zicato.query"]
forbidden_modules = ["zicato.dashboard"]

# uv workspace: the vendored dogfood targets under examples/ are a
# distinct distribution (zicato-examples). Declaring examples/ as a
# workspace member lets `uv sync --all-extras` install it editable
# alongside zicato — no PYTHONPATH or symlink hacks. It is wired into
# the `dev` extra above via the source mapping below.
[tool.uv.workspace]
members = ["examples"]

# The harmonograf-client subdirectory dep transitively requires goldfive
# (its sibling subpackage in the harmonograf monorepo). Harmonograf's
# parent pyproject pins goldfive via `path = "third_party/goldfive"`,
# which uv rewrites to a git+subdirectory URL when zicato pulls
# harmonograf-client over git. Zicato itself pins goldfive directly via
# its own [tool.uv.sources] entry — uv treats the two URL forms as
# distinct sources and refuses to resolve. Both forms resolve to the
# same commit (harmonograf's `third_party/goldfive` is itself pinned at
# the goldfive revision zicato wants), so `override-dependencies` forces a
# single canonical Goldfive source across the graph. The direct reference also
# lives in each public optional extra so standard pip installs do not depend on
# uv-only source configuration. Bump these references in lock-step.
[tool.uv]
override-dependencies = [
    "goldfive @ git+https://github.com/pedapudi/goldfive.git@d1d44829d43fee46c11b83c507fc772466b7f14e",
]

[tool.uv.sources]
zicato-examples = { workspace = true }
# harmonograf is a monorepo whose `harmonograf-client` subpackage lives
# under `client/` — so the git source pins a rev AND a subdirectory.
# `harmonograf_client` is the package the lazy import in
# telemetry/sink.py resolves; declaring the dependency here means every
# zicato install gets the live-streaming sink wire-attached
# automatically (no separate "install harmonograf-client" step). The
# rev is pinned for reproducibility; bump it when zicato needs a newer
# harmonograf-client. The repo is public on GitHub, so this resolves
# both locally and in CI with the default token — no secret required.
harmonograf-client = { git = "https://github.com/pedapudi/harmonograf.git", subdirectory = "client", rev = "ed3a3401e5853f59dbcc28fa36c8131250341735" }
# harmonograf-server is the same monorepo, server subdirectory. Pinned
# to the same rev as the client so the two never skew. zicato auto-
# launches its own harmonograf-server bound to a free localhost port at
# evolve startup (see zicato.telemetry.harmonograf_supervisor) so the
# operator no longer needs to keep a separate harmonograf process
# running; setting ``ZICATO_HARMONOGRAF_URL`` / ``integration.harmonograf_url``
# opts back into an external instance.
harmonograf-server = { git = "https://github.com/pedapudi/harmonograf.git", subdirectory = "server", rev = "ed3a3401e5853f59dbcc28fa36c8131250341735" }
# Foe is a monorepo whose Python host package lives under `python/`, so the
# git source pins a rev AND a subdirectory. The rev matches the direct
# reference in [project.dependencies]; bump both together, and rebuild the
