[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zicato"
version = "0.3.0"
description = "A self-improving harness for multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = [
    "agents",
    "multi-agent",
    "harness",
    "meta-learning",
    "drift",
    "goldfive",
    "adk",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core is intentionally light; storage / telemetry / LLMs are pluggable.
    "goldfive",
    # harmonograf_client ships the live-streaming sink the telemetry
    # layer attaches to every inner-harness run when
    # ZICATO_HARMONOGRAF_URL is set. It is imported lazily (see
    # telemetry/sink.py) so the package is still import-safe without it
    # installed; declaring it here ensures the sink resolves
    # automatically in every standard install — operators no longer need
    # a separate "install harmonograf-client" step to get the live view.
    # (zicato's meta-loop activity is surfaced through heartbeats +
    # journal/lineage + the post-run reducer, not goldfive Events; the
    # harmonograf view stays the per-run execution view by design.)
    "harmonograf-client",
    # harmonograf_server is the in-process console server zicato auto-
    # launches at evolve startup (see
    # zicato.telemetry.harmonograf_supervisor). Bound to a free
    # localhost port unless ZICATO_HARMONOGRAF_URL /
    # config.integration.harmonograf_url opts in to an external instance.
    # Imported lazily so a degraded install (missing dep) only disables
    # the live console; evolve still runs.
    "harmonograf-server",
    "click >= 8.1",
    "jsonschema >= 4.20",
]

[project.optional-dependencies]
adk = ["google-adk", "goldfive[adk]"]
# The standalone dashboard service: a Starlette/ASGI app served by
# uvicorn, with a watchdog-backed file watcher for the SSE stream.
dashboard = [
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
]
dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.23",
    # Parallel test execution across worker processes. The default test
    # run uses `-n auto` (see [tool.pytest.ini_options] addopts) so the
    # ~2630-case suite fans out across CPU cores. The suite is already
    # process-isolation-clean (tmp_path everywhere, dynamic ports via
    # bind(("127.0.0.1", 0)), tempdir-isolated worker fixtures) so xdist
    # needs no per-test fixes. `-n0` on the command line overrides back
    # to a single in-process serial run for debugging.
    "pytest-xdist >= 3.5",
    # The pre-commit framework itself, installed into .venv/bin/ via
    # `uv sync --all-extras`. The shared `.git/hooks/pre-commit` shim
    # (installed by `uv run pre-commit install`) execs
    # `.venv/bin/python -m pre_commit ...`, so pre-commit must live in
    # the project venv — not in a global pipx / uv-tool location — for
    # `git commit` to run the same checks contributors test with via
    # `uv run pre-commit run --all-files`.
    "pre-commit >= 4",
    # Pinned to the exact version the pre-commit ruff hook uses
    # (.pre-commit-config.yaml) so local lint/format and the hook
    # never diverge.
    "ruff == 0.5.7",
    "mypy >= 1.10",
    "types-jsonschema",
    "types-protobuf",
    # The dashboard service and its TestClient-based tests.
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
    "httpx >= 0.27",
    # The vendored dogfood targets — a separate distribution under
    # examples/, resolved as a uv workspace member (see
    # [tool.uv.sources] below). The test_example_* smoke tests import
    # it as `zicato_examples.*`. It is never shipped in the zicato
    # wheel.
    "zicato-examples",
]

[project.scripts]
zicato = "zicato.cli:main"

[project.urls]
Homepage = "https://github.com/pedapudi/zicato"
Issues = "https://github.com/pedapudi/zicato/issues"

[tool.hatch.build.targets.wheel]
# The package lives under a src/ root; hatchling strips the src/
# prefix so the wheel still ships top-level `zicato/`.
packages = ["src/zicato"]

# The dashboard's JS test harness under static/test/ is a developer
# tool — it runs the frontend behaviour tests under `node` and is
# exercised by tests/test_dashboard_js.py. It is NOT part of the
# shipped dashboard bundle, so it is excluded from the wheel.
exclude = [
    "src/zicato/dashboard/static/test",
]

# Custom build hook (hatch_build.py): compiles the Rust supervisor
# crate and bundles the binary at zicato/_bin/zicato-supervisor so it
# ships inside the wheel. Best-effort — see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist carries the crate source so a downstream wheel build can
# still run the supervisor build hook.
[tool.hatch.build.targets.sdist]
include = [
    "src/zicato",
    "crates",
    "Cargo.toml",
    "Cargo.lock",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
# Declare the in-repo packages as first-party so isort sorts them into
# their own import group (after third-party). Without this ruff treats
# `zicato` / `zicato_examples` as third-party and flags the blank line
# the source files place between them and real third-party imports
# (I001). Pre-commit only lints *changed* files, so the mismatch went
# unnoticed until CI's repo-wide `ruff check .`.
known-first-party = ["zicato", "zicato_examples"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

# goldfive, google.adk, and harmonograf_client are runtime-optional
# dependencies; their stubs are not on PyPI and the modules may not be
# importable in the typecheck environment. Treat references as untyped
# rather than erroring at import time so the typecheck still covers the
# rest of the tree. (harmonograf_client is now a hard runtime dependency
# via [tool.uv.sources] — pinned to a specific commit of
# github.com/pedapudi/harmonograf, subdirectory "client" — so the live-
# streaming sink resolves automatically; the lazy import inside a
# guarded try/except in zicato.telemetry.sink remains, both to keep the
# module import-safe in degraded installs and to tolerate API drift.)
#
# zicato.index / zicato.health are sibling subsystems the orchestrator
# and tournament runner import lazily and best-effort — a round runs
# fine without them and every import is wrapped in try/except
# ImportError. They may not be present in every checkout, so they get
# the same treatment: references are untyped rather than a hard import
# error.
[[tool.mypy.overrides]]
module = [
    "goldfive",
    "goldfive.*",
    "google",
    "google.*",
    "harmonograf_client",
    "harmonograf_client.*",
    "harmonograf_server",
    "harmonograf_server.*",
    "zicato.index",
    "zicato.index.*",
    "zicato.health",
    "zicato.health.*",
    # The dashboard transcript reconstructor is imported best-effort
    # behind a guarded try/except; its module may carry no py.typed
    # marker, so references are treated as untyped rather than erroring.
    "zicato.dashboard.transcript",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default run: fan out across CPU cores with pytest-xdist, and exclude
# the Node-suite shim from the in-pytest run. `-n auto` spawns one
# worker per detected core (the suite is process-isolation-clean — see
# the pytest-xdist note in the `dev` extra). Override to a single serial
# in-process run for debugging with `-n0` on the command line, e.g.
# `pytest -n0 tests/test_foo.py::test_bar`. `-m "not node"` drops the
# `test_dashboard_js` shim that re-runs the whole standalone Node suite
# inside pytest (a full duplicate of `make node-test` / the standalone
# `node src/zicato/dashboard/static/test/run-all.mjs` run); pass
# `-m node` (or `--no-header -m ''`) / run `make node-test` to exercise
# the Node behaviour suite.
addopts = "-n auto -m 'not node'"
# Custom markers. `node` tags tests that shell out to the `node` runtime
# (the dashboard JS harness); excluded from the default run via addopts.
markers = [
    "node: shells out to the standalone Node test harness (run via `make node-test`)",
]
# With the package under src/, an editable install puts `zicato` on
# sys.path, but a bare `pytest` from a non-installed checkout would
# not see it. Pin the repo root explicitly so src-layout imports
# resolve via the installed/editable package consistently.
pythonpath = ["."]

# uv workspace: the vendored dogfood targets under examples/ are a
# distinct distribution (zicato-examples). Declaring examples/ as a
# workspace member lets `uv sync --all-extras` install it editable
# alongside zicato — no PYTHONPATH or symlink hacks. It is wired into
# the `dev` extra above via the source mapping below.
[tool.uv.workspace]
members = ["examples"]

# The harmonograf-client subdirectory dep transitively requires goldfive
# (its sibling subpackage in the harmonograf monorepo). Harmonograf's
# parent pyproject pins goldfive via `path = "third_party/goldfive"`,
# which uv rewrites to a git+subdirectory URL when zicato pulls
# harmonograf-client over git. Zicato itself pins goldfive directly via
# its own [tool.uv.sources] entry — uv treats the two URL forms as
# distinct sources and refuses to resolve. Both forms resolve to the
# same commit (harmonograf's `third_party/goldfive` is itself pinned at
# the goldfive rev zicato wants), so `override-dependencies` forces a
# single canonical goldfive across the graph: harmonograf-client uses
# zicato's [tool.uv.sources] goldfive entry, eliminating the duplicate
# URL split. Bump this in lock-step with the `[tool.uv.sources]`
# goldfive rev above.
[tool.uv]
override-dependencies = [
    "goldfive",
]

[tool.uv.sources]
zicato-examples = { workspace = true }
# goldfive is a co-developed sibling package, not yet published to a
# package index. It IS, however, public on GitHub
# (github.com/pedapudi/goldfive), so uv resolves it from a git source:
# this works both for a local `uv sync` and in CI (a public git
# dependency clones with the default GITHUB_TOKEN — no secret needed).
# The rev is pinned so `uv.lock` is reproducible; bump it when zicato
# needs a newer goldfive. When goldfive is eventually published to an
# index, this entry is dropped and the [project.dependencies] spec
# resolves it from there. (The harmonograf-client entry below mirrors
# this pattern for the live-streaming sink.)
goldfive = { git = "https://github.com/pedapudi/goldfive.git", rev = "ed44eaaf93215a5d4ae122293c39fbd04ff204d6" }
# harmonograf is a monorepo whose `harmonograf-client` subpackage lives
# under `client/` — so the git source pins a rev AND a subdirectory.
# `harmonograf_client` is the package the lazy import in
# telemetry/sink.py resolves; declaring the dependency here means every
# zicato install gets the live-streaming sink wire-attached
# automatically (no separate "install harmonograf-client" step). The
# rev is pinned for reproducibility; bump it when zicato needs a newer
# harmonograf-client. The repo is public on GitHub, so this resolves
# both locally and in CI with the default token — no secret required.
harmonograf-client = { git = "https://github.com/pedapudi/harmonograf.git", subdirectory = "client", rev = "bd0175551ad5a7a79c29ce3937fcc7d8827e46f6" }
# harmonograf-server is the same monorepo, server subdirectory. Pinned
# to the same rev as the client so the two never skew. zicato auto-
# launches its own harmonograf-server bound to a free localhost port at
# evolve startup (see zicato.telemetry.harmonograf_supervisor) so the
# operator no longer needs to keep a separate harmonograf process
# running; setting ``ZICATO_HARMONOGRAF_URL`` / ``integration.harmonograf_url``
# opts back into an external instance.
harmonograf-server = { git = "https://github.com/pedapudi/harmonograf.git", subdirectory = "server", rev = "bd0175551ad5a7a79c29ce3937fcc7d8827e46f6" }
