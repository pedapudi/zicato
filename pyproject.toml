[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zicato"
version = "0.3.0"
description = "A self-improving harness for multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = [
    "agents",
    "multi-agent",
    "harness",
    "meta-learning",
    "drift",
    "goldfive",
    "adk",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core is intentionally light; storage / telemetry / LLMs are pluggable.
    "goldfive",
    "click >= 8.1",
    "jsonschema >= 4.20",
]

[project.optional-dependencies]
adk = ["google-adk", "goldfive[adk]"]
# The standalone dashboard service: a Starlette/ASGI app served by
# uvicorn, with a watchdog-backed file watcher for the SSE stream.
dashboard = [
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
]
dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.23",
    # Pinned to the exact version the pre-commit ruff hook uses
    # (.pre-commit-config.yaml) so local lint/format and the hook
    # never diverge.
    "ruff == 0.5.7",
    "mypy >= 1.10",
    "types-jsonschema",
    "types-protobuf",
    # The dashboard service and its TestClient-based tests.
    "starlette >= 0.40",
    "uvicorn >= 0.30",
    "watchdog >= 4.0",
    "httpx >= 0.27",
    # The vendored dogfood targets — a separate distribution under
    # examples/, resolved as a uv workspace member (see
    # [tool.uv.sources] below). The test_example_* smoke tests import
    # it as `zicato_examples.*`. It is never shipped in the zicato
    # wheel.
    "zicato-examples",
]

[project.scripts]
zicato = "zicato.cli:main"

[project.urls]
Homepage = "https://github.com/pedapudi/zicato"
Issues = "https://github.com/pedapudi/zicato/issues"

[tool.hatch.build.targets.wheel]
# The package lives under a src/ root; hatchling strips the src/
# prefix so the wheel still ships top-level `zicato/`.
packages = ["src/zicato"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

# goldfive and google.adk are runtime-optional dependencies; their
# stubs are not on PyPI and the modules may not be importable in the
# typecheck environment. Treat references as untyped rather than
# erroring at import time so the typecheck still covers the rest of
# the tree.
#
# zicato.index / zicato.health are sibling subsystems the orchestrator
# and tournament runner import lazily and best-effort — a round runs
# fine without them and every import is wrapped in try/except
# ImportError. They may not be present in every checkout, so they get
# the same treatment: references are untyped rather than a hard import
# error.
[[tool.mypy.overrides]]
module = [
    "goldfive",
    "goldfive.*",
    "google",
    "google.*",
    "zicato.index",
    "zicato.index.*",
    "zicato.health",
    "zicato.health.*",
    # The dashboard transcript reconstructor is imported best-effort
    # behind a guarded try/except; its module may carry no py.typed
    # marker, so references are treated as untyped rather than erroring.
    "zicato.dashboard.transcript",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# With the package under src/, an editable install puts `zicato` on
# sys.path, but a bare `pytest` from a non-installed checkout would
# not see it. Pin the repo root explicitly so src-layout imports
# resolve via the installed/editable package consistently.
pythonpath = ["."]

# uv workspace: the vendored dogfood targets under examples/ are a
# distinct distribution (zicato-examples). Declaring examples/ as a
# workspace member lets `uv sync --all-extras` install it editable
# alongside zicato — no PYTHONPATH or symlink hacks. It is wired into
# the `dev` extra above via the source mapping below.
[tool.uv.workspace]
members = ["examples"]

[tool.uv.sources]
zicato-examples = { workspace = true }
