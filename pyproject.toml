[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zicato"
version = "0.0.1"
description = "A self-improving harness for multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = [
    "agents",
    "multi-agent",
    "harness",
    "meta-learning",
    "drift",
    "goldfive",
    "adk",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core is intentionally light; storage / telemetry / LLMs are pluggable.
    "goldfive",
    "click",
    "jsonschema",
]

[project.optional-dependencies]
adk = ["google-adk", "goldfive[adk]"]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/pedapudi/zicato"
Issues = "https://github.com/pedapudi/zicato/issues"

[tool.hatch.build.targets.wheel]
packages = ["zicato"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
