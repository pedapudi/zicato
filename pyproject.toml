[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zicato"
version = "0.0.1"
description = "A self-improving harness for multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sunil Pedapudi" },
]
keywords = [
    "agents",
    "multi-agent",
    "harness",
    "meta-learning",
    "drift",
    "goldfive",
    "adk",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core is intentionally light; storage / telemetry / LLMs are pluggable.
    "goldfive",
    "click >= 8.1",
    "jsonschema >= 4.20",
]

[project.optional-dependencies]
adk = ["google-adk", "goldfive[adk]"]
dev = [
    "pytest >= 8",
    "pytest-asyncio >= 0.23",
    "ruff >= 0.5",
    "mypy >= 1.10",
    "types-jsonschema",
    "types-protobuf",
]

[project.scripts]
zicato = "zicato.cli:main"

[project.urls]
Homepage = "https://github.com/pedapudi/zicato"
Issues = "https://github.com/pedapudi/zicato/issues"

[tool.hatch.build.targets.wheel]
packages = ["zicato"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true

# goldfive and google.adk are runtime-optional dependencies; their
# stubs are not on PyPI and the modules may not be importable in the
# typecheck environment. Treat references as untyped rather than
# erroring at import time so the typecheck still covers the rest of
# the tree.
[[tool.mypy.overrides]]
module = [
    "goldfive",
    "goldfive.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
