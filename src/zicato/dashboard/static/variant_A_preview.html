<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Variant A — Mission Control (preview)</title>
  <!--
    Dev/preview host for Variant A. NOT the production entry — at
    integration the orchestrator injects `#variant-root` + the `?ui=A`
    flag into the real index.html and loads `app_A.js`. This page mounts
    the same variant against either LIVE endpoints (default) or a baked
    mock (append `?mock=1`) so the variant can be reviewed standalone.
  -->
  <style>html,body{margin:0;background:#07090e;}</style>
</head>
<body>
  <div id="variant-root"></div>
  <script type="module">
    // Optional mock so the preview renders a rich screen with no server.
    const params = new URLSearchParams(location.search);
    if (params.get('mock') === '1') {
      const MOCK = {
        '/api/workspace': {
          current_epoch_id: 'hardened_research',
          epochs: [
            { epoch_id: 'bootstrap', goal: 'Get the agent answering at all.', best_scalar: 0.91, generation_count: 4, promoted_count: 2, closed: true },
            { epoch_id: 'hardened_research', goal: 'Cut confabulation on long research briefs while keeping citations tight.', best_scalar: 0.42, generation_count: 6, promoted_count: 3, closed: false },
            { epoch_id: 'latency_pass', goal: 'Trim coordinator round-trips without losing pass-rate.', best_scalar: 0.66, generation_count: 3, promoted_count: 1, closed: false },
          ],
          sparkline: [ {scalar:0.91},{scalar:0.42},{scalar:0.66} ],
        },
        '/api/health-report': {
          epoch_id: 'hardened_research', healthy: false,
          findings: [
            { severity: 'warn', detector: 'narrow_score_variance', summary: 'Last 2 generations differ by < 0.01 scalar — the board may be losing teeth.' },
          ],
        },
        '/api/active-tournament': {
          tournament_id: 't1', epoch_id: 'hardened_research',
          parent_generation_id: 'v4', child_generation_id: 'v5',
          phase: 'running', round_index: 4, total_rounds: 6,
          partial_champion_agg: { scalar: 0.48 }, partial_challenger_agg: { scalar: 0.40 },
          entries: [
            { entry_id: 'short_solar', side: 'parent', status: 'done', loss_summary: { drift_loss: 0.42, pass_fail: 1 } },
            { entry_id: 'short_solar', side: 'child', status: 'done', loss_summary: { drift_loss: 0.31, pass_fail: 1 } },
            { entry_id: 'long_brief', side: 'parent', status: 'done', loss_summary: { drift_loss: 0.55, pass_fail: 0 } },
            { entry_id: 'long_brief', side: 'child', status: 'running' },
            { entry_id: 'contradictory', side: 'parent', status: 'running' },
            { entry_id: 'contradictory', side: 'child', status: 'queued' },
          ],
        },
        '/api/environment': {
          heartbeat: { epoch_id: 'hardened_research', generation_id: 'v5', phase: 'running', evolve_started_at: new Date(Date.now()-3725000).toISOString() },
          epochs: [ {epoch_id:'hardened_research', goal:'Cut confabulation.'} ],
          epoch: {
            epoch_id: 'hardened_research',
            goal: 'Cut confabulation on long research briefs while keeping citations tight.',
            brief: '## Goal\n\nReduce **CONFABULATION_RISK** on the research board without regressing pass-rate.\n\n## Constraints\n\n- Keep the coordinator routing untouched this epoch.\n- Prefer prompt edits over tool changes.\n\n## Notes for the proposer\n\nThe `researcher` agent confabulates citations on ~60% of long briefs. Tighten its `instruction` and `description`. Do not add new tools — the budget for tool-call latency is already tight.\n\n```\nfocus: researcher.instruction, researcher.description\navoid: coordinator.*, tools.*\n```',
            closed: false,
            delta_scalar_summary: { champion_spine: -0.49 },
            experiments: [
              { generation_id: 'v0', parent_generation_id: null, outcome: null, hypothesis: {} },
              { generation_id: 'v1', parent_generation_id: 'v0', hypothesis:{core_idea:'Tighten researcher prompt for citations.', why:'confab on 60% of research'}, outcome: { tournament_decision: 'promoted', scalar_score: 0.74, scalar_score_delta: -0.17, drift_loss_delta: -0.2, pass_rate_delta: 0.05 } },
              { generation_id: 'v2', parent_generation_id: 'v1', hypothesis:{core_idea:'Add a self-check pass.'}, outcome: { tournament_decision: 'rejected', scalar_score_delta: 0.03, drift_loss_delta: 0.04, pass_rate_delta: 0, rejection_reason: 'insufficient improvement' } },
              { generation_id: 'v3', parent_generation_id: 'v1', hypothesis:{core_idea:'Constrain the brief-reading step.'}, outcome: { tournament_decision: 'promoted', scalar_score: 0.6, scalar_score_delta: -0.14, drift_loss_delta: -0.16, pass_rate_delta: 0.0 } },
              { generation_id: 'v4', parent_generation_id: 'v3', hypothesis:{core_idea:'Shorten the system header.'}, outcome: { tournament_decision: 'promoted', scalar_score: 0.46, scalar_score_delta: -0.14, drift_loss_delta: -0.12, pass_rate_delta: 0.0 } },
            ],
          },
          active_tournament: null,
        },
        '/api/health': { version: 'A', port: 7892, build: 'mc' },
      };
      const realFetch = window.fetch;
      window.fetch = async (url) => {
        const path = String(url).split('?')[0];
        if (path in MOCK) return { ok: true, json: async () => MOCK[path] };
        if (path.includes('/per-entry')) {
          return { ok: true, json: async () => ({ entries: [
            { entry_id: 'short_solar', drift_loss: 0.31 },
            { entry_id: 'long_brief', drift_loss: 0.55 },
            { entry_id: 'contradictory', drift_loss: 0.40 },
          ] }) };
        }
        if (path.includes('/drift-movements')) {
          return { ok: true, json: async () => ({ movements: [
            { kind: 'CONFABULATION_RISK', champion_count: 9, challenger_count: 3, delta: -6 },
            { kind: 'CAPABILITY_MISMATCH', champion_count: 2, challenger_count: 4, delta: 2 },
            { kind: 'PLAN_REVISION', champion_count: 5, challenger_count: 5, delta: 0 },
          ] }) };
        }
        if (path.includes('/matchup-grid')) {
          return { ok: true, json: async () => ({ entry_grid: [
            { entry_id: 'short_solar', parent_drift_loss: 0.42, child_drift_loss: 0.31, parent_pass: 1, child_pass: 1, delta: -0.11, verdict: 'child' },
            { entry_id: 'long_brief', parent_drift_loss: 0.55, child_drift_loss: 0.40, parent_pass: 0, child_pass: 1, delta: -0.15, verdict: 'child' },
          ] }) };
        }
        if (path.includes('/files/')) return { ok: true, json: async () => ({ diff: '--- a/researcher/instruction\n+++ b/researcher/instruction\n@@\n-Answer the brief.\n+Answer the brief. Cite every claim with a source; if unsure, say so.' }) };
        return { ok: true, json: async () => ({}) };
      };
      // No SSE in mock mode.
      window.EventSource = class { constructor(){} addEventListener(){} close(){} };
    }
  </script>
  <script type="module" src="./app_A.js"></script>
</body>
</html>
