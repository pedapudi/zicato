<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>zicato dashboard</title>
  <!-- Brand favicons (served from static/brand/ at the document root). The tab
       icon is a bold "z" + green plucked-note on a self-contained dark tile —
       legible at 16px (the full mark is too fine for a favicon); the 180px
       apple-touch icon keeps the full mark, where its detail reads. -->
  <link rel="icon" type="image/svg+xml" href="brand/zicato-favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="brand/favicon-16.png" />
  <link rel="icon" type="image/x-icon" href="brand/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon-180.png" />
  <!-- The console is the sole shipping UI. It mounts into `#console-root`
       and loads its own scoped stylesheet (css/console.css) from console.js,
       so no global design-language sheets are needed here. The retired v1
       (phase0 shell) and v2 (Notebook/Bench) UIs are preserved at the git tag
       `dashboard-v1-v2-archive-2026-06-02`; see
       docs/design/DASHBOARD-VARIANTS.md. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ============ CONSOLE ROOT ========================================
       console.js paints the entire dashboard into this single host and
       injects its own scoped CSS. -->
  <div id="console-root"></div>

  <!-- ============ BOOTSTRAP ===========================================
       The console is the only UI, so its entry loads unconditionally. -->
  <script>
    (function loadConsoleEntry() {
      var e = document.createElement('script');
      e.type = 'module';
      e.src = 'console.js';
      document.body.appendChild(e);
    })();
  </script>
</body>
</html>
