<!DOCTYPE html>
<html lang="en" data-ui="variant-T">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>zicato dashboard</title>
  <!-- Variant T (Console IV) is the sole shipping UI. It mounts into
       `#variant-root` and loads its own scoped stylesheet
       (css/variants/T/console4.css) from app_T.js, so no global design-
       language sheets are needed here. The retired v1 (phase0 shell) and
       v2 (Notebook/Bench) UIs are preserved at the git tag
       `dashboard-v1-v2-archive-2026-06-02`; see
       docs/design/DASHBOARD-VARIANTS.md. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ============ VARIANT ROOT — Variant T (the sole UI) ===============
       app_T.js paints the entire dashboard into this single host and
       injects its own scoped CSS. -->
  <div id="variant-root" class="variant-root"></div>

  <!-- ============ BOOTSTRAP ===========================================
       Variant T is the only UI. Loaded unconditionally; `?ui=T` and no
       param both resolve to Variant T. -->
  <script>
    (function selectDashboardEntry() {
      document.documentElement.setAttribute('data-ui', 'variant-T');
      var e = document.createElement('script');
      e.type = 'module';
      e.src = 'app_T.js';
      document.body.appendChild(e);
    })();
  </script>
</body>
</html>
