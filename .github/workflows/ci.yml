name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  line-budget:
    name: line budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger check reads the base branch's copy of the table, so the
          # base ref has to exist locally.
          fetch-depth: 0

      - name: Report and enforce line budgets
        run: python tools/verify.py --only line-budget --report-dir "${{ runner.temp }}/verification-reports"

      - name: Check the ledger's arithmetic and that no row was dropped
        env:
          VERIFICATION_BASE: origin/${{ github.base_ref || github.ref_name }}
        run: python tools/verify.py --only ledger --report-dir "${{ runner.temp }}/verification-reports"

      - name: Show production logic per subsystem in the job summary
        run: |
          {
            echo '```'
            python tools/line_budget.py --report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore

  prose-lint:
    name: prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report prose that needs the development history to decode
        # Ratchet mode: the run fails only where a rule's count rises above
        # tools/prose_lint_baseline.json. The tree carries a standing backlog
        # of hits, so a whole-tree failure would be unlandable; a per-rule
        # ceiling keeps new ones out while the backlog is worked through.
        # A cleanup change lowers counts and leaves the file alone (a fall
        # is green); one later change regenerates it to the measured floor,
        # so parallel prose branches never contend for the baseline.
        run: python tools/verify.py --only prose --report-dir "${{ runner.temp }}/verification-reports"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore

  dashboard-javascript:
    name: dashboard JavaScript behaviour (Node 22)
    # Repository policy requires this result before merge. The job name is a
    # stable, visible status name; repository settings do not enforce it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dashboard JavaScript behaviour
        run: python tools/verify.py --only dashboard-javascript --report-dir "${{ runner.temp }}/verification-reports"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore

  lint-and-test:
    name: lint and default-tier tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # The cache is keyed off the committed uv.lock; without a
          # lockfile setup-uv has nothing to hash and the cache step is
          # a no-op. cache-dependency-glob makes the key explicit.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Restore supervisor build
        uses: ./.github/actions/supervisor-cache

      - name: Sync dependencies
        # --frozen installs exactly what uv.lock pins (and fails if the
        # lock is stale) — reproducible CI. goldfive resolves from its
        # public git source recorded in the lock; the default
        # GITHUB_TOKEN is sufficient to clone a public repo.
        run: uv sync --all-extras --frozen --reinstall-package zicato

      - name: Mypy cache
        # Mypy's incremental cache turns the from-scratch whole-tree check
        # into an incremental one on unchanged modules. Keyed on the
        # dependency pins (pyproject + uv.lock) per Python version;
        # restore-keys lets a run reuse the newest cache after a pin bump.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-3.12-

      - name: Ruff
        run: uv run --no-sync python tools/verify.py --only python-style --report-dir "${{ runner.temp }}/verification-reports"

      - name: Ruff formatting
        run: uv run --no-sync python tools/verify.py --only python-format --report-dir "${{ runner.temp }}/verification-reports"

      - name: Import contracts
        # Every production namespace has a declared role. The shared
        # checker derives forbidden imports and checks the root facade.
        run: uv run --no-sync python tools/verify.py --only import-boundaries --report-dir "${{ runner.temp }}/verification-reports"

      - name: Mypy
        run: uv run --no-sync python tools/verify.py --only python-types --report-dir "${{ runner.temp }}/verification-reports"

      - name: Pytest (default tier)
        # The shared plan discovers tool tests and excludes the slow tier.
        # The statistical workflow reports that required tier separately.
        run: uv run --no-sync python tools/verify.py --only python-default --report-dir "${{ runner.temp }}/verification-reports"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore

  parity:
    name: parity gates (Python 3.12)
    # Python suites and type checking have separate required owners.
    runs-on: ubuntu-latest
    env:
      # tools/parity.sh shells out to `uv run`; --frozen keeps those from
      # re-resolving the lock mid-gate.
      UV_FROZEN: "1"
      UV_PYTHON: "3.12"
      # Preserve the wheel installed and checked below.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Restore supervisor build
        uses: ./.github/actions/supervisor-cache

      - name: Sync dependencies
        # The gates import the tests/ helpers and the examples package.
        run: uv sync --all-extras --frozen --reinstall-package zicato --no-editable

      - name: Verify installed supervisor
        run: .venv/bin/python tools/verify.py --only installed-supervisor --installed-wheel --report-dir "${{ runner.temp }}/verification-reports"

      - name: Parity gates
        run: uv run --no-sync python tools/verify.py --only parity --report-dir "${{ runner.temp }}/verification-reports"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore

  supervisor:
    name: supervisor (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: python tools/verify.py --only rust-format --report-dir "${{ runner.temp }}/verification-reports"

      - name: Clippy
        run: python tools/verify.py --only rust-clippy --report-dir "${{ runner.temp }}/verification-reports"

      - name: Test
        run: python tools/verify.py --only rust-tests --report-dir "${{ runner.temp }}/verification-reports"

      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}
          path: ${{ runner.temp }}/verification-reports/
          if-no-files-found: ignore
