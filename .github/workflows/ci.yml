name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  line-budget:
    name: line budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger check reads the base branch's copy of the table, so the
          # base ref has to exist locally.
          fetch-depth: 0

      - name: Report and enforce line budgets
        run: python tools/line_budget.py --check

      - name: Check the ledger's arithmetic and that no row was dropped
        run: |
          python tools/line_budget.py --check-ledger \
            --base "origin/${{ github.base_ref || github.ref_name }}"

  prose-lint:
    name: prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report prose that needs the development history to decode
        # Ratchet mode: the run fails only where a rule's count rises above
        # tools/prose_lint_baseline.json. The tree carries a standing backlog
        # of hits, so a whole-tree failure would be unlandable; a per-rule
        # ceiling keeps new ones out while the backlog is worked through.
        # A cleanup change lowers counts and leaves the file alone (a fall
        # is green); one later change regenerates it to the measured floor,
        # so parallel prose branches never contend for the baseline.
        run: python tools/prose_lint.py --baseline tools/prose_lint_baseline.json

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # The cache is keyed off the committed uv.lock; without a
          # lockfile setup-uv has nothing to hash and the cache step is
          # a no-op. cache-dependency-glob makes the key explicit.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # --frozen installs exactly what uv.lock pins (and fails if the
        # lock is stale) — reproducible CI. goldfive resolves from its
        # public git source recorded in the lock; the default
        # GITHUB_TOKEN is sufficient to clone a public repo.
        run: uv sync --all-extras --frozen

      - name: Mypy cache
        # Mypy's incremental cache turns the from-scratch whole-tree check
        # into an incremental one on unchanged modules. Keyed on the
        # dependency pins (pyproject + uv.lock) per Python version;
        # restore-keys lets a run reuse the newest cache after a pin bump.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Ruff
        run: uv run ruff check .

      - name: Import contracts
        # The library/driver boundaries ([tool.importlinter] in
        # pyproject.toml): lib packages never import the drivers; only
        # the declared driver->driver edges exist.
        run: uv run lint-imports

      - name: Mypy
        run: uv run mypy src/zicato/

      - name: Pytest (default tier)
        # The DEFAULT TIER ONLY. A pull request does not run the `slow`
        # tier: those seven tests are 5 minutes of the 6 a full run takes,
        # and .github/workflows/slow-tier.yml runs them nightly against
        # main instead, so a regression in one surfaces within a day rather
        # than on every branch.
        #
        # The exclusion is stated here rather than inherited: the `slow`
        # tier is deselected only for a BARE `pytest`, and this step names
        # paths. Stating it is also the honest form for a gate — the step
        # says what it runs. The three tools/ paths ride here because they
        # live outside the `testpaths` root: the prose linter's own suite,
        # the affected-tests selector's, and the guard that holds every
        # workflow file to what the runner requires — unique step names,
        # one `run` or `uses` per step, no repeated keys.
        run: >-
          uv run pytest tests/ tools/test_prose_lint.py
          tools/test_affected_tests.py tools/test_workflows.py
          -m "not node and not cascade_oc and not slow"

  parity:
    name: parity gates (${{ matrix.python-version }})
    # PYTEST is skipped: lint-and-test's Pytest step already runs the
    # default tier (pyproject testpaths = ["tests"]), and the `slow` tier
    # runs nightly in slow-tier.yml. Every other gate runs.
    #
    # Every supported interpreter, not one: a golden is a claim that the
    # bytes are a function of the code and the inputs, and running it on a
    # single version cannot distinguish that from a function of the
    # interpreter. CPython 3.12 changed the builtin `sum` over floats to
    # compensated summation, which moved a served scalar by one ulp and made
    # a mock-evolve golden green on 3.12 and red on 3.11. The aggregation
    # seam now uses math.fsum so the values are exact either way
    # (tests/test_scalar_aggregation_is_exact.py); this matrix is what would
    # catch the next such difference instead of an operator running the
    # ladder on the other version.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # tools/parity.sh shells out to `uv run`; --frozen keeps those from
      # re-resolving the lock mid-gate.
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # The gates import the tests/ helpers and the examples package.
        run: uv sync --all-extras --frozen

      - name: Mypy cache
        # Shares lint-and-test's key so the MYPY gate restores that cache
        # instead of paying for a cold whole-tree check.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Parity gates
        run: bash tools/parity.sh --skip PYTEST

  supervisor:
    name: supervisor (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  pi-proposer:
    name: pi proposer (opt-in)
    # The external-proposer lane (issue #147). It installs a Node runtime
    # from an external registry, so it is OPT-IN: set the repository
    # variable RUN_PI_LANE to "1", or put the `pi` label on the PR. The
    # default lanes are unaffected — the `pi`-marked tests skip cleanly
    # when integrations/pi has not been installed.
    if: >-
      vars.RUN_PI_LANE == '1' ||
      contains(github.event.pull_request.labels.*.name, 'pi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Set up Node
        # pi declares engines.node >= 22.19.0.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned pi runtime
        # The exact version in package.json plus the publisher's own
        # npm-shrinkwrap.json determine the whole tree, so there is no
        # lockfile of ours to install from (see integrations/pi/README.md).
        run: npm install --no-audit --no-fund
        working-directory: integrations/pi

      - name: Envelope + transport against real pi
        # The launch envelope asserted against the running agent: the
        # active tool list must equal the sanctioned set.
        run: uv run pytest tests/ -m pi
