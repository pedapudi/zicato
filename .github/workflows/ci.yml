name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  line-budget:
    name: line budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report and enforce line budgets
        run: python tools/line_budget.py --check

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # The cache is keyed off the committed uv.lock; without a
          # lockfile setup-uv has nothing to hash and the cache step is
          # a no-op. cache-dependency-glob makes the key explicit.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        # --frozen installs exactly what uv.lock pins (and fails if the
        # lock is stale) — reproducible CI. goldfive resolves from its
        # public git source recorded in the lock; the default
        # GITHUB_TOKEN is sufficient to clone a public repo.
        run: uv sync --all-extras --frozen

      - name: Mypy cache
        # Mypy's incremental cache turns the from-scratch whole-tree check
        # into an incremental one on unchanged modules. Keyed on the
        # dependency pins (pyproject + uv.lock) per Python version;
        # restore-keys lets a run reuse the newest cache after a pin bump.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-

      - name: Ruff
        run: uv run ruff check .

      - name: Import contracts
        # The library/driver boundaries ([tool.importlinter] in
        # pyproject.toml): lib packages never import the drivers; only
        # the declared driver->driver edges exist.
        run: uv run lint-imports

      - name: Mypy
        run: uv run mypy src/zicato/

      - name: Pytest
        run: uv run pytest tests/

  parity:
    name: parity gates
    # PYTEST is skipped: that gate runs the same suite as lint-and-test's
    # Pytest step (pyproject testpaths = ["tests"]). Every other gate runs.
    runs-on: ubuntu-latest
    env:
      # tools/parity.sh shells out to `uv run`; --frozen keeps those from
      # re-resolving the lock mid-gate.
      UV_FROZEN: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        # The gates import the tests/ helpers and the examples package.
        run: uv sync --all-extras --frozen

      - name: Mypy cache
        # Shares lint-and-test's key so the MYPY gate restores that cache
        # instead of paying for a cold whole-tree check.
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            mypy-3.12-

      - name: Parity gates
        run: bash tools/parity.sh --skip PYTEST

  supervisor:
    name: supervisor (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  pi-proposer:
    name: pi proposer (opt-in)
    # The external-proposer lane (issue #147). It installs a Node runtime
    # from an external registry, so it is OPT-IN: set the repository
    # variable RUN_PI_LANE to "1", or put the `pi` label on the PR. The
    # default lanes are unaffected — the `pi`-marked tests skip cleanly
    # when integrations/pi has not been installed.
    if: >-
      vars.RUN_PI_LANE == '1' ||
      contains(github.event.pull_request.labels.*.name, 'pi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Set up Node
        # pi declares engines.node >= 22.19.0.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned pi runtime
        # The exact version in package.json plus the publisher's own
        # npm-shrinkwrap.json determine the whole tree, so there is no
        # lockfile of ours to install from (see integrations/pi/README.md).
        run: npm install --no-audit --no-fund
        working-directory: integrations/pi

      - name: Envelope + transport against real pi
        # The launch envelope asserted against the running agent: the
        # active tool list must equal the sanctioned set.
        run: uv run pytest tests/ -m pi
