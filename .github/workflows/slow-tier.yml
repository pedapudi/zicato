name: statistical and end-to-end oracles

# The seven tests measured at 15 s or more alone — the decision-procedure
# power harness, the racing convergence oracle, the gauntlet evidence-gate
# end-to-end run and the cascade smoke run. Together they are about five of
# the six minutes a full suite takes. This separate workflow keeps their
# pull-request result visible without delaying the default test job. It also
# runs nightly against main and on demand from the Actions tab. The stable job
# name keeps the Python 3.12 result visible. Repository policy requires this
# result before merge.
#
# The local merge ladder runs the same tests: `make test` and
# tools/parity.sh's PYTEST gate each run both tiers.

on:
  pull_request:
  schedule:
    # 07:00 UTC daily. Nothing depends on the exact hour; it is outside the
    # working day in the maintainer's timezone so a red result is waiting
    # rather than interrupting.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  slow-tier:
    name: statistical and end-to-end oracles (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Pytest (slow tier)
        # A command-line -m REPLACES the pyproject selector, so `not node`
        # and `not cascade_oc` are restated rather than inherited.
        run: uv run pytest tests/ -m "slow and not node and not cascade_oc"
