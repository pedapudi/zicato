name: statistical and end-to-end oracles

# Required statistical and complete-loop tests report separately from the
# default Python selection. Local verification selects the same cases through
# tools/verify.py. Repository policy requires both results before merge.

on:
  pull_request:
  workflow_dispatch:

jobs:
  slow-tier:
    name: statistical and end-to-end oracles (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Restore supervisor build
        uses: ./.github/actions/supervisor-cache

      - name: Sync dependencies
        run: uv sync --all-extras --frozen --reinstall-package zicato

      - name: Pytest (slow tier)
        # A command-line -m REPLACES the pyproject selector, so `not node`
        # and `not cascade_oc` are restated rather than inherited.
        run: uv run --no-sync python tools/verify.py --only python-slow
